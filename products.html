  <style>
    .variations-label { font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: #7e98a8; margin-bottom: 10px; }

    .related-section { background: #fff; padding: 3rem 2.5rem; }
    .section-eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 3px; color: #7e98a8; text-transform: uppercase; text-align: center; margin-bottom: 6px; }
    .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(24px, 4vw, 34px); font-weight: 300; color: #CD7250; text-align: center; margin-bottom: 2rem; }

    .related-price { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: #CD7250; }

    .bar-row   { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; width: 100%; }
    .bar-label { font-size: 10px; color: #aaa; font-weight: 700; width: 34px; text-align: right; flex-shrink: 0; }
    .bar-track { flex: 1; height: 6px; background: #f0ebe9; border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; background: #E99075; border-radius: 3px; }
    .reviews-list { display: flex; flex-direction: column; gap: 12px; }
    .review-card { background: #fff; border-radius: 16px; padding: 1.1rem 1.25rem; }
    .review-top  { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .review-name { font-size: 13px; font-weight: 900; color: #CD7250; }
    .review-date { font-size: 11px; color: #aaa; font-weight: 700; }
    .review-stars { display: flex; gap: 2px; margin-bottom: 8px; }

    .footer-socials { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
    .social-btn { display: inline-flex; align-items: center; gap: 8px; background: #adc2cf; color: #fff; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; padding: 11px 22px; border-radius: 50px; text-decoration: none; transition: background 0.2s; }
    .social-btn:hover { background: #E7DFE1; color: #7e98a8; }

    .contact-email { font-size: 13px; color: #fff; font-weight: 700; }
    .footer-copy  { font-size: 11px; color: #dde8ef; margin-top: 1.75rem; opacity: 0.7; }
    .not-found { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 2rem; }
    .not-found h2 { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: #CD7250; }
    .not-found p  { font-size: 14px; color: #a0756a; }
    .not-found a  { display: inline-block; background: #CD7250; color: #fff; font-weight: 900; padding: 12px 28px; border-radius: 50px; text-decoration: none; font-size: 14px; margin-top: 0.5rem; }
    @media (max-width: 768px) {
      .nav { padding: 1rem 1.25rem; justify-content: space-between; }

      .product-info-col { padding-left: 0; }

      .social-btn { justify-content: center; }

    }
    @media (max-width: 480px) {
      .product-name { font-size: 28px; }
      .btn-row { flex-direction: column; }

  <!-- ─── Lighter product page theme (overrides the base styles above) ─── -->
  <style>
    :root {
      --page:      #FFF1EE;   /* very light pink, so it stands apart from the white "Meet her friends" section */
      --blush:     #FBEAE6;   /* soft pink panels */
      --blush-2:   #F5D9D3;   /* borders / dividers */
      --rose:      #EDC1BB;   /* site's signature pink */
      --terracotta:#CD7250;   /* site's main accent */
      --terra-ink: #B95E3C;   /* same hue, a touch deeper for button text contrast */
      --coral:     #E99075;
      --pink:      #e891a1;
      --slate:     #7e98a8;
      --ink:       #5E4640;   /* body text — much darker than before */
    }

    body { background: var(--page); }
    .breadcrumb { opacity: 1; color: var(--slate); }
    .breadcrumb a { color: var(--terracotta); }

    .product-section { background: var(--page); padding: 2.5rem 2.5rem 4rem; gap: 1rem; }

    /* Image sits on a blush card with sparkles, like the reference */
    .product-img-col { position: relative; padding: 0 2.5rem 0 0; }
    .product-img-main { background: var(--blush); border: 2px solid var(--blush-2); border-radius: 28px; padding: 18px; }
    .product-img-main img { border-radius: 18px; }
    .product-img-col::before,
    .product-img-col::after {
      content: '✦'; position: absolute; color: var(--pink); pointer-events: none; z-index: 2;
    }
    .product-img-col::before { top: -14px; left: -10px; font-size: 30px; }
    .product-img-col::after  { top: 38%; right: 1.1rem; font-size: 18px; color: var(--coral); }
    .thumb { background: var(--blush); border: 2px solid var(--blush-2); border-radius: 14px; }
    .thumb-row { flex-wrap: wrap; }
    .accordion-body p { margin: 0 0 0.6em; }
    .accordion-body p:last-child { margin-bottom: 0; }
    .accordion-body a { color: var(--terra-ink); font-weight: 700; }
    .thumb.active { border-color: var(--terracotta); }

    /* Text: bolder heading, darker body copy */
    .product-info-col { gap: 1.25rem; padding-left: 1.5rem; }
    .product-eyebrow { color: var(--pink); font-weight: 900; }
    .product-name { font-family: 'Cooper Black', 'Cormorant Garamond', serif; font-weight: 400; color: var(--terracotta); font-size: clamp(28px, 3.2vw, 40px); line-height: 1.15; }
    .product-price { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 24px; color: var(--ink); }
    .product-desc { color: var(--ink); font-size: 15px; line-height: 1.8; }
    .inline-stars .count { color: #9a8580; }

    .variation-btn { border-color: var(--blush-2); color: var(--ink); }
    .variation-btn.active { background: var(--blush); }

    /* Quantity: outlined pill with soft round − / + */
    .qty-label { color: var(--slate); }
    .qty-controls { background: #fff; border: 2px solid var(--blush-2); border-radius: 50px; padding: 4px; gap: 4px; }
    .qty-btn, .qty-btn.minus, .qty-btn.plus {
      background: var(--blush); color: var(--terracotta); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; font-weight: 700;
    }
    .qty-btn:hover { background: var(--rose); color: #fff; }
    .qty-num { color: var(--ink); width: 34px; background: transparent; }

    /* Buttons: flat pills with arrow, like the reference */
    .btn-row { gap: 12px; }
    .add-btn, .buy-btn {
      box-shadow: none; font-size: 15px; padding: 14px 0; border-radius: 50px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .add-btn { background: #fff; color: var(--terra-ink); border: 2px solid var(--terracotta); }
    .add-btn:hover { background: var(--blush); }
    .buy-btn { background: var(--terra-ink); color: #fff; border: 2px solid var(--terra-ink); }
    .buy-btn:hover { background: var(--terracotta); transform: translateY(-2px); box-shadow: none; }

    /* Details rows: softer lines, readable labels, round + icons */
    .accordion, .accordion-item { border-color: var(--blush-2); }
    .accordion-header span { color: var(--ink); }
    .accordion-icon { width: 26px; height: 26px; border-radius: 50%; background: var(--blush); display: inline-flex; align-items: center; justify-content: center; font-size: 16px; }
    .accordion-body { color: var(--ink); }

    /* Lower sections match the lighter look */
    .related-section { background: #fff; }
    .reviews-section { background: var(--blush); }
    .related-name { color: var(--ink); }
    .review-text { color: var(--ink); }


    /* ─── Reviews: real data + "Leave a review" pop-up ─── */
    .reviews-head { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 2rem; }
    .reviews-head .section-title { margin-bottom: 0; }
    .pill-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--terra-ink); color: #fff; border: 2px solid var(--terra-ink); font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; padding: 11px 24px; border-radius: 50px; cursor: pointer; transition: background 0.2s, transform 0.15s; }
    .pill-btn:hover { background: var(--terracotta); transform: translateY(-2px); }
    .pill-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .pill-btn.ghost { background: #fff; color: var(--terra-ink); }
    .pill-btn.ghost:hover { background: var(--blush); }
    .review-photos { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .review-photos a { display: block; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; border: 2px solid var(--blush-2); }
    .review-photos img { width: 100%; height: 100%; object-fit: cover; }
    .reviews-empty { background: #fff; border-radius: 16px; padding: 1.5rem; text-align: center; color: var(--ink); font-size: 14px; line-height: 1.7; }
    .reviews-empty strong { color: var(--terracotta); }
    .reviews-more { text-align: center; margin-top: 4px; }
    .inline-stars .no-reviews { font-size: 12px; font-weight: 700; color: var(--terracotta); text-decoration: none; }

    .rv-overlay { position: fixed; inset: 0; background: rgba(94, 70, 64, 0.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 300; }
    .rv-overlay.open { display: flex; }
    .rv-modal { position: relative; background: var(--page); border-radius: 24px; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 2rem 1.75rem 1.75rem; box-shadow: 0 20px 60px rgba(94, 70, 64, 0.25); }
    .rv-modal::before { content: '✦'; position: absolute; top: 14px; left: 18px; color: var(--pink); font-size: 20px; }
    .rv-close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--blush); color: var(--terracotta); font-size: 20px; cursor: pointer; line-height: 1; }
    .rv-close:hover { background: var(--rose); color: #fff; }
    .rv-title { font-family: 'Cooper Black', serif; font-size: 26px; color: var(--terracotta); text-align: center; margin-bottom: 4px; }
    .rv-sub { text-align: center; font-size: 13px; color: var(--slate); font-weight: 700; margin-bottom: 1.25rem; }
    .rv-field { margin-bottom: 1.1rem; }
    .rv-label { display: block; font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--slate); margin-bottom: 8px; }
    .rv-stars { display: flex; gap: 4px; }
    .rv-star { background: none; border: none; font-size: 34px; line-height: 1; color: var(--blush-2); cursor: pointer; padding: 0 2px; transition: transform 0.1s, color 0.1s; }
    .rv-star.on { color: var(--coral); }
    .rv-star:hover { transform: scale(1.12); }
    .rv-star:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 2px; border-radius: 6px; }
    .rv-input, .rv-textarea { width: 100%; font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--ink); background: #fff; border: 2px solid var(--blush-2); border-radius: 14px; padding: 11px 14px; outline: none; transition: border-color 0.15s; }
    .rv-input:focus, .rv-textarea:focus { border-color: var(--terracotta); }
    .rv-textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    .rv-count { text-align: right; font-size: 11px; color: #9a8580; margin-top: 4px; }
    .rv-photo-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .rv-thumb { position: relative; width: 72px; height: 72px; border-radius: 12px; overflow: hidden; border: 2px solid var(--blush-2); }
    .rv-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .rv-thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none; background: rgba(255,255,255,0.9); color: var(--terracotta); font-size: 13px; line-height: 1; cursor: pointer; }
    .rv-add-photo { width: 72px; height: 72px; border-radius: 12px; border: 2px dashed var(--rose); background: var(--blush); color: var(--terracotta); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 22px; cursor: pointer; }
    .rv-add-photo span { font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
    .rv-hint { font-size: 11px; color: #9a8580; margin-top: 6px; }
    .rv-error { display: none; background: #fdecea; color: #a8402a; font-size: 13px; font-weight: 700; border-radius: 12px; padding: 10px 14px; margin-bottom: 1rem; }
    .rv-error.show { display: block; }
    .rv-honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .rv-submit { width: 100%; justify-content: center; padding: 14px 24px; font-size: 15px; }
    .rv-done { text-align: center; padding: 1rem 0 0.5rem; }
    .rv-done .rv-sparkle { font-size: 40px; color: var(--pink); }
    .rv-done p { color: var(--ink); font-size: 14px; line-height: 1.7; margin: 8px 0 1.25rem; }

    @media (max-width: 768px) {
      .product-img-col { padding-right: 0; }
      .product-img-col::after { right: 0.5rem; }
      .product-info-col { padding-left: 0; }
    }
  </style>
</head>
<body>

  <div id="navMount"></div>

  <div id="pageContent"></div>

  <script src="products.js"></script>
  <script src="basket.js"></script>
  <script src="nav.js"></script>

  <script>
    // Real reviews are loaded from /api/reviews (Google Sheet) after the page renders.
    var reviewData = { reviews: [], summary: { total: 0, avg: 0, bars: [0, 0, 0, 0, 0] } };
    var reviewsShown = 5;

    // Escape customer-written text before putting it on the page.
    function esc(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    var currentProduct = null;
    var qty = 1;

    function starsHTML(count, size) {
      size = size || 14;
      var html = '';
      for (var i = 1; i <= 5; i++) {
        html += i <= count
          ? '<span style="color:#E99075;font-size:' + size + 'px;">★</span>'
          : '<span style="color:#e0e0e0;font-size:' + size + 'px;">★</span>';
      }
      return html;
    }

    function productImgHTML(p) {
      if (p.image) return '<img src="' + p.image + '" alt="' + p.name + '">';
      return '<div class="img-placeholder"><span>Image coming soon</span></div>';
    }

    // Shipping & Returns text, shared by every product page.
    function returnsPolicyHTML() {
      var email = (typeof MAHF_CONTACT_EMAIL !== 'undefined') ? MAHF_CONTACT_EMAIL : '';
      var mail = '<a href="mailto:' + email + '">' + email + '</a>';
      return '<p><strong>Delivery:</strong> Standard UK delivery takes 3–5 working days. Free shipping on orders over £25.</p>' +
        '<p><strong>14-day change of mind:</strong> You can cancel your order for any reason within 14 days of receiving it. ' +
        'Let us know within those 14 days, then send the item back unused and in its original condition within a further 14 days. ' +
        'We\'ll refund you within 14 days of getting it back, including standard delivery costs. Return postage is paid by you.</p>' +
        '<p><strong>Faulty or damaged items:</strong> If something arrives faulty, damaged or not as described, you can return it within 30 days for a full refund, and we\'ll cover the return postage.</p>' +
        '<p><strong>Refunds and questions:</strong> To ask for a refund or with any other questions, email us at ' + mail + '.</p>' +
        '<p style="font-size:12px;opacity:.8;">This doesn\'t affect your statutory rights under UK consumer law.</p>';
    }

    // Small photos under the main picture — as many as the product has.
    function thumbRowHTML(images) {
      return (images || []).filter(Boolean).map(function (src, i) {
        return '<div class="thumb' + (i === 0 ? ' active' : '') + '" onclick="switchThumb(this,' + i + ')"><img src="' + src + '" alt="Photo ' + (i + 1) + '"></div>';
      }).join('');
    }

    function variationsHTML(product) {
      if (!product.variations || product.variations.length === 0) return '';
      var html = '<p class="variations-label">Choose your friend</p><div class="variations-row">';
      product.variations.forEach(function (v, i) {
        html += '<button class="variation-btn' + (i === 0 ? ' active' : '') + '" onclick="selectVariation(\'' + v.id + '\')" id="var-btn-' + v.id + '">' +
          '<span class="variation-swatch" style="background:' + v.colour + ';"></span>' + v.label +
          '</button>';
      });
      html += '</div>';
      return html;
    }

    function selectVariation(varId) {
      var product = MAHF_PRODUCT_MAP[currentProduct.id];
      if (!product || !product.variations) return;
      var variation = null;
      for (var i = 0; i < product.variations.length; i++) {
        if (product.variations[i].id === varId) { variation = product.variations[i]; break; }
      }
      if (!variation) return;

      document.querySelectorAll('.variation-btn').forEach(function (btn) { btn.classList.remove('active'); });
      var activeBtn = document.getElementById('var-btn-' + varId);
      if (activeBtn) activeBtn.classList.add('active');

      var mainImg = document.getElementById('mainImg');
      if (mainImg) mainImg.innerHTML = '<img src="' + variation.image + '" alt="' + variation.label + '">';

      var row = document.getElementById('thumbRow');
      if (row) row.innerHTML = thumbRowHTML(variation.thumbImages);

      // The basket gets this option's own id, name and price.
      currentProduct.itemId      = variation.id;
      currentProduct.price       = variation.price;
      currentProduct.image       = variation.image;
      currentProduct.thumbImages = (variation.thumbImages || []).filter(Boolean);
      currentProduct.variantLabel = variation.label;

      var priceEl = document.querySelector('.product-price');
      if (priceEl) priceEl.textContent = '£' + variation.price.toFixed(2);
    }

    function changeQtyPage(delta) {
      qty = Math.max(1, qty + delta);
      var el = document.getElementById('qtyNum');
      if (el) el.textContent = qty;
    }

    function handleAddToBasket() {
      if (!currentProduct) return;
      var item = MAHF_ITEM_MAP[currentProduct.itemId];
      if (!item) return;
      addToBasketById(item.id, item.name, item.price, currentProduct.accentColour || '#e8a0a0', qty, item.image);
    }

    function handleBuyNow() {
      handleAddToBasket();
      window.location.href = 'checkout.html';
    }

    function switchThumb(el, index) {
      document.querySelectorAll('.thumb').forEach(function (t) { t.classList.remove('active'); });
      el.classList.add('active');
      if (currentProduct && currentProduct.thumbImages && currentProduct.thumbImages[index]) {
        document.getElementById('mainImg').innerHTML =
          '<img src="' + currentProduct.thumbImages[index] + '" alt="' + currentProduct.name + '">';
      }
    }

    function toggleAcc(header) {
      var body   = header.nextElementSibling;
      var icon   = header.querySelector('.accordion-icon');
      var isOpen = body.classList.contains('open');
      document.querySelectorAll('.accordion-body').forEach(function (b) { b.classList.remove('open'); });
      document.querySelectorAll('.accordion-icon').forEach(function (i) { i.textContent = '+'; });
      if (!isOpen) { body.classList.add('open'); icon.textContent = '−'; }
    }

    function footerHTML() {
      return '<footer class="footer">' +
        '<p class="footer-title">Stay in the loop ✦</p>' +
        '<p class="footer-sub">Follow along for new drops, behind-the-scenes &amp; community love</p>' +
        '<div class="footer-socials">' +
          '<a class="social-btn" href="#">Instagram</a>' +
          '<a class="social-btn" href="#">TikTok</a>' +
          '<a class="social-btn" href="#">Facebook</a>' +
        '</div>' +
        '<hr class="footer-divider"/>' +
        '<div class="contact-box"><p class="contact-label">Get in touch</p><p class="contact-email">hello@myadorablehijabifriend.com</p></div>' +
        '<p class="footer-copy">© 2025 My Adorable Hijabi Friend · Made with love in the UK</p>' +
      '</footer>';
    }

    function renderPage() {
      var params  = new URLSearchParams(window.location.search);
      var id      = params.get('id');
      var product = MAHF_PRODUCT_MAP[id];

      if (!product) {
        document.getElementById('pageContent').innerHTML =
          '<div class="not-found"><h2>Oops — we can\'t find that one!</h2><p>The product you\'re looking for doesn\'t exist.</p><a href="index.html">← Back to home</a></div>' + footerHTML();
        document.title = 'Not Found — My Adorable Hijabi Friend';
        return;
      }

      currentProduct = {
        id:          id,
        itemId:      id,
        name:        product.name,
        price:       product.price,
        accentColour: product.accentColour || '#e8a0a0',
        image:       product.image,
        thumbImages: (product.thumbImages || []).filter(Boolean)
      };

      document.title = product.name + ' — My Adorable Hijabi Friend';

      var relatedHTML = product.related.map(function (relId) {
        var rel = MAHF_PRODUCT_MAP[relId];
        if (!rel) return '';
        var relImg = rel.image
          ? '<img src="' + rel.image + '" alt="' + rel.name + '">'
          : '<span style="font-size:11px;font-weight:700;color:#CD7250;opacity:0.5;">No image</span>';
        return '<a class="related-card" href="products.html?id=' + relId + '">' +
          '<div class="related-img" style="background:' + rel.colour + ';">' + relImg + '</div>' +
          '<p class="related-name">' + rel.name + '</p>' +
          '<p class="related-price">£' + rel.price.toFixed(2) + '</p>' +
        '</a>';
      }).join('');

      document.getElementById('pageContent').innerHTML =
        '<div class="breadcrumb"><a href="index.html">Home</a> › <a href="shop.html">Shop</a> › ' + product.name + '</div>' +
        '<section class="product-section">' +
          '<div class="product-img-col">' +
            '<div class="product-img-main" id="mainImg">' + productImgHTML(product) + '</div>' +
            '<div class="thumb-row" id="thumbRow">' + thumbRowHTML(product.thumbImages) + '</div>' +
          '</div>' +
          '<div class="product-info-col">' +
            '<p class="product-eyebrow">✦ ' + product.variant + '</p>' +
            '<h1 class="product-name">' + product.name + '</h1>' +
            '<p class="product-price">£' + product.price.toFixed(2) + '</p>' +
            '<div class="inline-stars" id="inlineStars">' + inlineStarsHTML() + '</div>' +
            '<p class="product-desc">' + product.description + '</p>' +
            variationsHTML(product) +
            '<div class="qty-wrapper"><span class="qty-label">Qty</span><div class="qty-controls"><button class="qty-btn minus" onclick="changeQtyPage(-1)">−</button><span class="qty-num" id="qtyNum">1</span><button class="qty-btn plus" onclick="changeQtyPage(1)">+</button></div></div>' +
            '<div class="btn-row"><button class="add-btn" onclick="handleAddToBasket()">Add to basket</button><button class="buy-btn" onclick="handleBuyNow()">Buy now →</button></div>' +
            '<div class="accordion">' +
              '<div class="accordion-item"><div class="accordion-header" onclick="toggleAcc(this)"><span>Details</span><i class="accordion-icon">+</i></div>' +
              '<div class="accordion-body"><div class="acc-badges"><div class="acc-badge"><span class="acc-badge-icon">🎀</span><p class="acc-badge-title">Gift ready</p><p class="acc-badge-sub">Free gift wrapping on request</p></div><div class="acc-badge"><span class="acc-badge-icon">📦</span><p class="acc-badge-title">Ships fast</p><p class="acc-badge-sub">Dispatched within 2 working days</p></div><div class="acc-badge"><span class="acc-badge-icon">🚚</span><p class="acc-badge-title">Free shipping</p><p class="acc-badge-sub">On UK orders over £25</p></div></div>' + product.details + '</div></div>' +
              '<div class="accordion-item"><div class="accordion-header" onclick="toggleAcc(this)"><span>Shipping &amp; Returns</span><i class="accordion-icon">+</i></div><div class="accordion-body">' + returnsPolicyHTML() + '</div></div>' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<section class="related-section"><p class="section-eyebrow">You might also like</p><h2 class="section-title">Meet her friends!</h2><div class="related-grid">' + relatedHTML + '</div></section>' +
        '<section class="reviews-section" id="reviews">' +
          '<div class="reviews-head"><p class="section-eyebrow" style="margin-bottom:0;">What people are saying</p><h2 class="section-title">Customer Reviews</h2>' +
          '<button class="pill-btn" onclick="openReviewForm()">✦ Leave a review</button></div>' +
          '<div class="reviews-grid" id="reviewsBody">' + reviewsBodyHTML() + '</div>' +
        '</section>' +
        reviewFormHTML() +
        footerHTML();

      if (product.variations && product.variations.length > 0) {
        selectVariation(product.variations[0].id);
      }
    }

    // ─── Reviews ──────────────────────────────────────────────────────────────
    function inlineStarsHTML() {
      var s = reviewData.summary;
      if (!s.total) return '<a href="#reviews" class="no-reviews">No reviews yet · be the first ✦</a>';
      return '<div class="stars">' + starsHTML(Math.round(s.avg)) + '</div><span class="avg">' + s.avg.toFixed(1) + '</span><span class="count">(' + s.total + ')</span><a href="#reviews" class="review-chevron" title="See all reviews">›</a>';
    }

    function formatMonth(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    }

    function reviewCardHTML(r) {
      var photos = (r.photos || []).map(function (url) {
        return '<a href="' + esc(url) + '" target="_blank" rel="noopener"><img src="' + esc(url) + '" alt="Customer photo" loading="lazy"></a>';
      }).join('');
      return '<div class="review-card">' +
        '<div class="review-top"><span class="review-name">' + esc(r.name) + '</span><span class="review-date">' + esc(formatMonth(r.date)) + '</span></div>' +
        '<div class="review-stars">' + starsHTML(r.rating, 12) + '</div>' +
        '<p class="review-text">' + esc(r.text) + '</p>' +
        (photos ? '<div class="review-photos">' + photos + '</div>' : '') +
      '</div>';
    }

    function reviewsBodyHTML() {
      var s = reviewData.summary;
      var scoreBox =
        '<div class="review-score-box"><div class="rscore-big">' + (s.total ? s.avg.toFixed(1) : '–') + '</div><div class="rscore-outof">out of 5</div>' +
        '<div class="rscore-stars">' + starsHTML(Math.round(s.avg), 16) + '</div>' +
        '<div class="rscore-count">' + s.total + (s.total === 1 ? ' Review' : ' Reviews') + '</div>' +
        '<div style="margin-top:10px;width:100%;">' +
          ['5 Star', '4 Star', '3 Star', '2 Star', '1 Star'].map(function (label, i) {
            return '<div class="bar-row"><span class="bar-label">' + label + '</span><div class="bar-track"><div class="bar-fill" style="width:' + s.bars[i] + '%;"></div></div></div>';
          }).join('') +
        '</div></div>';

      var list;
      if (!reviewData.reviews.length) {
        list = '<div class="reviews-empty"><strong>No reviews yet.</strong><br>Have you met this little friend? We\'d love to hear what you think!</div>';
      } else {
        list = reviewData.reviews.slice(0, reviewsShown).map(reviewCardHTML).join('');
        if (reviewData.reviews.length > reviewsShown) {
          list += '<div class="reviews-more"><button class="pill-btn ghost" onclick="showMoreReviews()">Show more reviews</button></div>';
        }
      }
      return scoreBox + '<div class="reviews-list">' + list + '</div>';
    }

    function refreshReviews() {
      var body = document.getElementById('reviewsBody');
      var inline = document.getElementById('inlineStars');
      if (body) body.innerHTML = reviewsBodyHTML();
      if (inline) inline.innerHTML = inlineStarsHTML();
    }

    function showMoreReviews() { reviewsShown += 5; refreshReviews(); }

    function loadReviews() {
      if (!currentProduct) return;
      fetch('/api/reviews?product=' + encodeURIComponent(currentProduct.id))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data || !data.summary) return;
          reviewData = { reviews: data.reviews || [], summary: data.summary };
          refreshReviews();
        })
        .catch(function () { /* keep the empty state */ });
    }

    // ─── "Leave a review" pop-up ──────────────────────────────────────────────
    var rvRating = 0;
    var rvPhotos = []; // { type, data (base64), preview (data URL) }
    var RV_MAX_PHOTOS = 3;
    var rvLastFocus = null;

    function reviewFormHTML() {
      var stars = '';
      for (var i = 1; i <= 5; i++) {
        stars += '<button type="button" class="rv-star" data-value="' + i + '" aria-label="' + i + ' star' + (i > 1 ? 's' : '') + '" onclick="setRvRating(' + i + ')" onmouseenter="paintRvStars(' + i + ')" onmouseleave="paintRvStars(rvRating)">★</button>';
      }
      return '<div class="rv-overlay" id="rvOverlay" onclick="if(event.target===this)closeReviewForm()">' +
        '<div class="rv-modal" role="dialog" aria-modal="true" aria-labelledby="rvTitle">' +
          '<button class="rv-close" onclick="closeReviewForm()" aria-label="Close">×</button>' +
          '<div id="rvFormWrap">' +
            '<h3 class="rv-title" id="rvTitle">Leave a review</h3>' +
            '<p class="rv-sub">' + esc(currentProduct.name) + '</p>' +
            '<form id="rvForm" onsubmit="submitReview(event)" novalidate>' +
              '<div class="rv-error" id="rvError" role="alert"></div>' +
              '<div class="rv-field"><span class="rv-label">Your rating</span><div class="rv-stars" id="rvStars" role="radiogroup" aria-label="Star rating">' + stars + '</div></div>' +
              '<div class="rv-field"><label class="rv-label" for="rvName">Your name</label><input class="rv-input" id="rvName" maxlength="50" placeholder="e.g. Fatima A." autocomplete="given-name"></div>' +
              '<div class="rv-field"><label class="rv-label" for="rvText">Your review</label><textarea class="rv-textarea" id="rvText" maxlength="1500" placeholder="What did you (or your little one) think?" oninput="document.getElementById(\'rvCount\').textContent=this.value.length+\' / 1500\'"></textarea><div class="rv-count" id="rvCount">0 / 1500</div></div>' +
              '<div class="rv-field"><span class="rv-label">Photos (optional)</span><div class="rv-photo-row" id="rvPhotoRow"></div><p class="rv-hint">Up to 3 photos. JPG, PNG or WEBP.</p>' +
                '<input type="file" id="rvFile" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="addRvPhotos(this.files); this.value=\'\';"></div>' +
              '<div class="rv-honeypot" aria-hidden="true"><label>Leave this empty <input id="rvWebsite" tabindex="-1" autocomplete="off"></label></div>' +
              '<button type="submit" class="pill-btn rv-submit" id="rvSubmit">Submit review →</button>' +
            '</form>' +
          '</div>' +
          '<div class="rv-done" id="rvDone" style="display:none;"><div class="rv-sparkle">✦</div><h3 class="rv-title">Thank you for your feedback.</h3><p>Your review has been sent.</p><button class="pill-btn" onclick="closeReviewForm()">Back to the shop</button></div>' +
        '</div>' +
      '</div>';
    }

    function openReviewForm() {
      rvLastFocus = document.activeElement;
      document.getElementById('rvOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
      renderRvPhotos();
      var first = document.querySelector('.rv-star');
      if (first && document.getElementById('rvFormWrap').style.display !== 'none') first.focus();
    }

    function closeReviewForm() {
      document.getElementById('rvOverlay').classList.remove('open');
      document.body.style.overflow = '';
      if (document.getElementById('rvDone').style.display !== 'none') resetReviewForm();
      if (rvLastFocus) rvLastFocus.focus();
    }

    function resetReviewForm() {
      rvRating = 0; rvPhotos = [];
      document.getElementById('rvForm').reset();
      document.getElementById('rvCount').textContent = '0 / 1500';
      paintRvStars(0); renderRvPhotos(); showRvError('');
      document.getElementById('rvFormWrap').style.display = '';
      document.getElementById('rvDone').style.display = 'none';
    }

    document.addEventListener('keydown', function (e) {
      var overlay = document.getElementById('rvOverlay');
      if (e.key === 'Escape' && overlay && overlay.classList.contains('open')) closeReviewForm();
    });

    function setRvRating(n) { rvRating = n; paintRvStars(n); showRvError(''); }

    function paintRvStars(n) {
      document.querySelectorAll('.rv-star').forEach(function (b) {
        var v = Number(b.getAttribute('data-value'));
        b.classList.toggle('on', v <= n);
        b.setAttribute('aria-pressed', v === rvRating ? 'true' : 'false');
      });
    }

    function renderRvPhotos() {
      var row = document.getElementById('rvPhotoRow');
      if (!row) return;
      var html = rvPhotos.map(function (p, i) {
        return '<div class="rv-thumb"><img src="' + p.preview + '" alt="Photo ' + (i + 1) + '"><button type="button" onclick="removeRvPhoto(' + i + ')" aria-label="Remove photo">×</button></div>';
      }).join('');
      if (rvPhotos.length < RV_MAX_PHOTOS) {
        html += '<button type="button" class="rv-add-photo" onclick="document.getElementById(\'rvFile\').click()">+<span>Add photo</span></button>';
      }
      row.innerHTML = html;
    }

    function removeRvPhoto(i) { rvPhotos.splice(i, 1); renderRvPhotos(); }

    // Shrink photos in the browser (max 1600px, JPEG) so uploads are quick.
    function shrinkImage(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file);
        var img = new Image();
        img.onload = function () {
          var scale = Math.min(1, 1600 / Math.max(img.width, img.height));
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          resolve({ type: 'image/jpeg', data: dataUrl.split(',')[1], preview: dataUrl });
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
        img.src = url;
      });
    }

    function addRvPhotos(fileList) {
      var files = Array.prototype.slice.call(fileList, 0, RV_MAX_PHOTOS - rvPhotos.length);
      if (fileList.length > files.length) showRvError('You can add up to 3 photos.');
      files.reduce(function (chain, file) {
        return chain.then(function () {
          return shrinkImage(file).then(function (photo) {
            rvPhotos.push(photo); renderRvPhotos();
          }).catch(function () {
            showRvError('Sorry, we couldn\'t read "' + file.name + '". Please try a JPG or PNG photo.');
          });
        });
      }, Promise.resolve());
    }

    function showRvError(msg) {
      var el = document.getElementById('rvError');
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('show', !!msg);
      if (msg) el.scrollIntoView({ block: 'nearest' });
    }

    function submitReview(e) {
      e.preventDefault();
      var name = document.getElementById('rvName').value.trim();
      var text = document.getElementById('rvText').value.trim();
      if (!rvRating) return showRvError('Please choose a star rating.');
      if (!name) return showRvError('Please enter your name.');
      if (text.length < 10) return showRvError('Please write a few more words (at least 10 characters).');
      showRvError('');

      var btn = document.getElementById('rvSubmit');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      fetch('/api/reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          productId: currentProduct.id,
          rating: rvRating,
          name: name,
          text: text,
          website: document.getElementById('rvWebsite').value,
          photos: rvPhotos.map(function (p) { return { type: p.type, data: p.data }; })
        })
      })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, data: d }; }); })
        .then(function (res) {
          if (!res.ok || !res.data.ok) throw new Error(res.data.error || 'Something went wrong. Please try again.');
          document.getElementById('rvFormWrap').style.display = 'none';
          document.getElementById('rvDone').style.display = '';
        })
        .catch(function (err) {
          showRvError(err.message || 'Something went wrong. Please try again.');
        })
        .then(function () {
          btn.disabled = false;
          btn.textContent = 'Submit review →';
        });
    }

    renderPage();
    loadReviews();
  </script>
</body>
</html>
